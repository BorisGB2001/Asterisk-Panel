; Example dialplan with the CEL events Asterisk-Panel uses to rebuild the path of a call.
; Node ids (r, r0, r02…) and queue ids (q1…) must match ivr_map.json. Values must not contain commas.

[line-74951234567]
exten => s,1,Set(REC=${STRFTIME(${EPOCH},,%Y/%m/%d)}/${UNIQUEID}-${FILTER(0-9+,${CALLERID(num)})}.wav)
 same => n,Set(CDR(recordingfile)=${REC})            ; cdr.recordingfile column
 same => n,MixMonitor(${REC},b)
 same => n,CELGenUserEvent(LINE,74951234567)
 same => n,CELGenUserEvent(RECORDING,${REC})
 same => n,Answer()
 same => n,Goto(ivr-r,s,1)

[ivr-r]
exten => s,1,CELGenUserEvent(IVR_NODE,r)
 same => n(play),Background(ivr/welcome)
 same => n,WaitExten(10)
exten => 0,1,CELGenUserEvent(IVR_KEY,r:0)            ; node:key
 same => n,Goto(ivr-r0,s,1)
exten => t,1,CELGenUserEvent(IVR_KEY,r:timeout)
 same => n,CELGenUserEvent(IVR_EXIT,queue-q1)
 same => n,Goto(queue-q1,s,1)
exten => i,1,CELGenUserEvent(IVR_KEY,r:invalid:${FILTER(0-9*#,${INVALID_EXTEN})})
 same => n,Goto(ivr-r,s,play)

[queue-q1]
exten => s,1,CELGenUserEvent(QUEUE_ENTER,q1)
 same => n,Queue(q1,t,,,20)                          ; queue name = id in ivr_map.json
 same => n,Goto(queue-q2,s,1)
