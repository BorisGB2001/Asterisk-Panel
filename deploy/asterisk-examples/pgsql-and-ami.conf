; Example Asterisk configuration for Asterisk-Panel. Split into the files named in the headers,
; replace CHANGE_ME with the passwords from secrets.env. Then: core reload, logger reload,
; module load cdr_pgsql.so / cel_pgsql.so / res_config_pgsql.so if they declined to load before.

; ---- cdr_pgsql.conf ----
[global]
hostname=127.0.0.1
port=5432
dbname=asterisk
user=asterisk
password=CHANGE_ME_DB_ASTERISK_PASSWORD
table=cdr
encoding=UTF8
timezone=UTC

; ---- cel.conf ----
[general]
enable=yes
apps=all
events=ALL

; ---- cel_pgsql.conf ----
[global]
hostname=127.0.0.1
port=5432
dbname=asterisk
user=asterisk
password=CHANGE_ME_DB_ASTERISK_PASSWORD
table=cel
usegmtime=yes

; ---- res_pgsql.conf ----
[general]
dbhost=127.0.0.1
dbport=5432
dbname=asterisk
dbuser=asterisk
dbpass=CHANGE_ME_DB_ASTERISK_PASSWORD
requirements=warn

; ---- extconfig.conf ----
[settings]
queue_log => pgsql,general,queue_log

; ---- logger.conf ([general] section) ----
; queue_adaptive_realtime: fields go to data1..data5 (the queue_log table has no "data" column)
queue_log = yes
queue_log_to_file = yes
queue_log_realtime_use_gmt = yes
queue_adaptive_realtime = yes

; ---- manager.conf ----
[general]
enabled = yes
port = 5038
bindaddr = 127.0.0.1

[panel]
secret = CHANGE_ME_AMI_SECRET
deny = 0.0.0.0/0.0.0.0
permit = 127.0.0.1/255.255.255.255
read = system,call,agent,user,security,reporting
; command: Settings page shows the Asterisk version and can restart Asterisk when there are no calls
write = system,call,agent,reporting,command

; ---- pjsip.conf ----
; transport, templates and subscribers are written by the panel
[global]
type=global
user_agent=Asterisk
#include panel/pjsip.conf

; ---- queues.conf ----
[general]
persistentmembers=yes
autofill=yes
#include panel/queues.conf

; ---- rtp.conf ----
#include panel/rtp.conf
